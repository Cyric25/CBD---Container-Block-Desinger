<!--
    Prüfseite für assets/js/board-mode.js (PLAN-Rueckmeldungen-Blockverweis-
    iPad-Tafel-Darkmode-Formeln.md, Phase 2). NICHT Teil des Plugin-ZIPs
    (create-plugin-zip.js nimmt tools/ nicht auf).

    Aufruf: als statische Datei im Browser öffnen (file:///…/tools/test-board-zeiger.html)
    oder über den lokalen Webserver. Ergebnisse stehen in der Tabelle und in
    window.__ergebnisse (für Konsole/Automatisierung), Zusammenfassung in
    window.__zusammenfassung.

    Echte Apple-Geräte stehen nicht zur Verfügung: Stift und Finger werden mit
    synthetischen PointerEvents (pointerType 'pen'/'touch'/'mouse',
    unterschiedliche pointerId, width/height) nachgestellt. setPointerCapture()
    wirft bei synthetischen Zeigern (kein aktiver Zeiger) - board-mode.js
    muss das abfangen.

    AP-4.0 (#7152, PLAN-Rueckmeldungen-Klassenmodus-und-Tafel-Lasso.md):
    Textmarker über der Schrift eines Basisbilds (wieder geöffnete Tafel,
    zurückgeholte Seite). Diese Prüfungen laden Bilder asynchron - das
    Ergebnis steht erst nach Abschluss in window.__zusammenfassung.

    AP-4.3 (Phase 4): board-mode.js arbeitet auf dem Elementmodell
    (board-elemente.js, daher vor board-mode.js geladen). Die Prüfungen dazu
    stehen in test-board-modell.js und hängen sich über window.__zusatzTests
    bzw. window.__zusatzTestsAsync ein (vor test-board-zeiger.js geladen,
    das die Haken beim Lauf aufruft).

    AP-5.1 (Phase 5): Lasso-Werkzeug (Auswahl und Auswahlanzeige) -
    Prüfungen in test-board-lasso.js, nach test-board-speichern.js geladen,
    gleiche Haken. AP-5.2 (Verschieben, Löschen, Rückgängig, Speichern):
    ebenfalls in test-board-lasso.js.
    3.1.143: Drehen/Duplizieren der Auswahl und Raster Kästchen/Zeilen -
    Prüfungen in test-board-drehen.js, nach test-board-standard.js geladen.
    3.1.144: Textgröße der Auswahl (A−/A+) - Prüfungen in
    test-board-textgroesse.js, nach test-board-drehen.js geladen.
    Formatierter Text (PLAN-Blocktext-Formatierung.md, AP-1.3): Zeichnen und
    Messen von Text-Elementen mit Feld teile (fett, kursiv, Farbe) -
    Prüfungen in test-board-format.js, nach test-board-textgroesse.js und
    vor test-board-blocktext.js geladen.
    Blocktext auf die Tafel (PLAN-Blocktext-auf-Tafel.md, Phase 2): Modul
    ../assets/js/board-blocktext.js direkt nach board-elemente.js (wie auf
    der Website vor board-mode.js); Prüfungen in test-board-blocktext.js als
    letzte Zusatzdatei vor test-board-zeiger.js. Die Fixture-Prüfungen holen
    tools/fixtures/blocktext/*.html per fetch - die Seite muss dafür über den
    Webserver laufen, nicht als file://.
-->
